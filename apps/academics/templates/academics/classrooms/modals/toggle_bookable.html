{# academics/templates/academics/classrooms/modals/toggle_bookable.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-info text-white">
            <h5 class="modal-title">
                <i class="fa fa-calendar-check me-2"></i>{{ action|title }}
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4">
            <div class="mb-3">
                <i class="fa fa-calendar-check text-info" style="font-size: 4rem;"></i>
            </div>
            <h4 class="mb-3">{{ action|title }}?</h4>
            <div class="alert alert-info">
                <strong>{{ classroom.name }}</strong><br>
                <small>Room: {{ classroom.room_number }}</small>
            </div>
        </div>
        
        <form hx-post="{% url 'academics:classroom_toggle_bookable' classroom.pk %}"
              hx-target="#classroom-results"
              hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-info">
                    Yes, {{ action|title }}
                </button>
            </div>
        </form>
    </div>
</div>
