{# academics/templates/academics/classes/modals/toggle_active.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header {% if action == 'activate' %}bg-success{% else %}bg-warning{% endif %} text-white">
            <h5 class="modal-title"><i class="fa fa-toggle-{% if action == 'activate' %}on{% else %}off{% endif %} me-2"></i>{{ action|title }} Class</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4">
            <div class="mb-3"><i class="fa fa-toggle-{% if action == 'activate' %}on text-success{% else %}off text-warning{% endif %}" style="font-size: 4rem;"></i></div>
            <h4 class="mb-3">{{ action|title }} Class?</h4>
            <div class="alert alert-info"><strong>{{ class.get_display_name }}</strong><br><small>Session: {{ class.academic_session.name }}</small></div>
        </div>
        <form hx-post="{% url 'academics:class_toggle_active' class.pk %}" hx-target="#class-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn {% if action == 'activate' %}btn-success{% else %}btn-warning{% endif %}">Yes, {{ action|title }}</button>
            </div>
        </form>
    </div>
</div>
