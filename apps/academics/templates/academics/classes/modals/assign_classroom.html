{# academics/templates/academics/classes/modals/assign_classroom.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-info text-white">
            <h5 class="modal-title"><i class="fa fa-door-open me-2"></i>Assign Classroom</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'academics:class_assign_classroom' class.pk %}" hx-target="#class-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <div class="alert alert-info">
                    <strong>{{ class.get_display_name }}</strong><br>
                    <small>Session: {{ class.academic_session.name }}</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Select Classroom</label>
                    <select name="classroom" class="form-select" required>
                        <option value="">Choose a classroom...</option>
                        {% for classroom in classrooms %}
                            <option value="{{ classroom.pk }}" {% if class.classroom == classroom %}selected{% endif %}>
                                {{ classroom.room_number }} - {{ classroom.name }} (Cap: {{ classroom.capacity }})
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-info"><i class="fa fa-save me-1"></i>Assign Classroom</button>
            </div>
        </form>
    </div>
</div>
