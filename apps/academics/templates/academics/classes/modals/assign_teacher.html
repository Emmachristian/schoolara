{# academics/templates/academics/classes/modals/assign_teacher.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-info text-white">
            <h5 class="modal-title"><i class="fa fa-user-plus me-2"></i>Assign Teacher</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'academics:class_assign_teacher' class.pk %}" hx-target="#class-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <div class="alert alert-info">
                    <strong>{{ class.get_display_name }}</strong><br>
                    <small>Session: {{ class.academic_session.name }}</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Select Teacher</label>
                    <select name="teacher" class="form-select" required>
                        <option value="">Choose a teacher...</option>
                        {% for teacher in teachers %}
                            <option value="{{ teacher.pk }}" {% if class.class_teacher == teacher %}selected{% endif %}>
                                {{ teacher.staff.full_name }} ({{ teacher.staff.staff_id }})
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-info"><i class="fa fa-save me-1"></i>Assign Teacher</button>
            </div>
        </form>
    </div>
</div>
