{# academics/templates/academics/class_subjects/modals/assign_teacher.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-info text-white">
            <h5 class="modal-title"><i class="fa fa-user-plus me-2"></i>Assign Teacher</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'academics:class_subject_assign_teacher' class_subject.pk %}" hx-target="#class-subject-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <div class="alert alert-info">
                    <strong>{{ class_subject.subject.name }}</strong><br>
                    <small>Class: {{ class_subject.class_instance }}</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Select Teacher</label>
                    <select name="teacher" class="form-select" required>
                        <option value="">Choose...</option>
                        {% for t in teachers %}
                            <option value="{{ t.pk }}" {% if class_subject.teacher == t %}selected{% endif %}>{{ t.staff.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-info"><i class="fa fa-save me-1"></i>Assign</button>
            </div>
        </form>
    </div>
</div>
