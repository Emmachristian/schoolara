{# academics/templates/academics/enrollments/modals/assign_roll_number.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-info text-white">
            <h5 class="modal-title"><i class="fa fa-hashtag me-2"></i>Assign Roll Number</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'academics:enrollment_assign_roll' enrollment.pk %}" hx-target="#enrollment-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <div class="alert alert-info">
                    <strong>{{ enrollment.student.get_full_name }}</strong><br>
                    <small>Class: {{ enrollment.class_instance }}</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Roll Number</label>
                    <input type="text" name="roll_number" class="form-control" value="{{ suggested_roll_number }}" required>
                    <small class="text-muted">Suggested: {{ suggested_roll_number }}</small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-info"><i class="fa fa-save me-1"></i>Assign Roll Number</button>
            </div>
        </form>
    </div>
</div>
