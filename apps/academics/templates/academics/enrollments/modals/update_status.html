{# academics/templates/academics/enrollments/modals/update_status.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-warning text-dark">
            <h5 class="modal-title"><i class="fa fa-edit me-2"></i>Update Status</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'academics:enrollment_update_status' enrollment.pk %}" hx-target="#enrollment-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <div class="alert alert-info">
                    <strong>{{ enrollment.student.get_full_name }}</strong><br>
                    <small>Class: {{ enrollment.class_instance }}</small><br>
                    <small>Current Status: {{ enrollment.get_completion_status_display }}</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Status</label>
                    <select name="status" class="form-select" required>
                        {% for value, label in enrollment.COMPLETION_STATUS_CHOICES %}
                            <option value="{{ value }}" {% if enrollment.completion_status == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Notes (optional)</label>
                    <textarea name="notes" class="form-control" rows="3"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-warning"><i class="fa fa-save me-1"></i>Update Status</button>
            </div>
        </form>
    </div>
</div>
