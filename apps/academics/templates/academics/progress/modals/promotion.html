{# academics/templates/academics/progress/modals/promotion.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-success text-white">
            <h5 class="modal-title"><i class="fa fa-arrow-up me-2"></i>Promotion Decision</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'academics:progress_promotion' progress.pk %}" hx-target="#progress-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <div class="alert alert-info">
                    <strong>{{ progress.student.get_full_name }}</strong><br>
                    <small>Session: {{ progress.academic_session.name }}</small><br>
                    <small>Performance: {{ progress.percentage }}% ({{ progress.overall_grade }})</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Promotion Decision</label>
                    <select name="decision" class="form-select" required>
                        {% for v, l in progress.PROMOTION_DECISION_CHOICES %}
                            <option value="{{ v }}" {% if progress.promotion_decision == v %}selected{% endif %}>{{ l }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Promoted To Level</label>
                    <select name="promoted_to" class="form-select">
                        <option value="">Select level...</option>
                        {# levels would be passed in context #}
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-success"><i class="fa fa-save me-1"></i>Save Decision</button>
            </div>
        </form>
    </div>
</div>
