{# academics/templates/academics/subjects/modals/toggle_active.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header {% if action == 'activate' %}bg-success{% else %}bg-warning{% endif %} text-white">
            <h5 class="modal-title">
                <i class="fa fa-toggle-{% if action == 'activate' %}on{% else %}off{% endif %} me-2"></i>
                {% if action == 'activate' %}Activate{% else %}Deactivate{% endif %} Subject
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4">
            <div class="mb-3">
                <i class="fa fa-toggle-{% if action == 'activate' %}on text-success{% else %}off text-warning{% endif %}" style="font-size: 4rem;"></i>
            </div>
            <h4 class="mb-3">{% if action == 'activate' %}Activate{% else %}Deactivate{% endif %} Subject?</h4>
            <div class="alert alert-info">
                <strong>{{ subject.name }}</strong><br>
                <small>Code: {{ subject.code }}</small>
            </div>
        </div>
        
        <form hx-post="{% url 'academics:subject_toggle_active' subject.pk %}"
              hx-target="#subject-results"
              hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn {% if action == 'activate' %}btn-success{% else %}btn-warning{% endif %}">
                    Yes, {% if action == 'activate' %}Activate{% else %}Deactivate{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
