{# exams/templates/exams/grading_systems/modals/toggle_active.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header {% if action == 'activate' %}bg-success{% else %}bg-warning{% endif %} text-white">
            <h5 class="modal-title">
                <i class="fa {% if action == 'activate' %}fa-check-circle{% else %}fa-ban{% endif %} me-2"></i>
                {{ action|title }} Grading System
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4">
            <div class="mb-3">
                <i class="fa {% if action == 'activate' %}fa-check-circle text-success{% else %}fa-ban text-warning{% endif %}" style="font-size: 4rem;"></i>
            </div>
            <h4 class="mb-3">{{ action|title }} System?</h4>
            <div class="alert alert-info">
                <strong>{{ system.name }}</strong><br>
                <small>{{ system.get_grading_type_display }}</small>
            </div>
        </div>
        <form hx-post="{% url 'exams:grading_system_toggle_active' system.pk %}" hx-target="#system-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn {% if action == 'activate' %}btn-success{% else %}btn-warning{% endif %}">
                    <i class="fa {% if action == 'activate' %}fa-check{% else %}fa-ban{% endif %} me-1"></i>Yes, {{ action|title }}
                </button>
            </div>
        </form>
    </div>
</div>
