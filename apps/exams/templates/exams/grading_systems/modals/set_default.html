{# exams/templates/exams/grading_systems/modals/set_default.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-success text-white">
            <h5 class="modal-title"><i class="fa fa-star me-2"></i>Set Default Grading System</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4">
            <div class="mb-3"><i class="fa fa-star text-success" style="font-size: 4rem;"></i></div>
            <h4 class="mb-3">Set as Default?</h4>
            <div class="alert alert-info">
                <strong>{{ system.name }}</strong><br>
                <small>{{ system.get_grading_type_display }}</small>
            </div>
            {% if current_default %}
                <div class="alert alert-warning">
                    <i class="fa fa-info-circle me-2"></i>
                    <strong>Current Default:</strong> {{ current_default.name }}<br>
                    <small>This will be replaced.</small>
                </div>
            {% endif %}
        </div>
        <form hx-post="{% url 'exams:grading_system_set_default' system.pk %}" hx-target="#system-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-success"><i class="fa fa-star me-1"></i>Yes, Set as Default</button>
            </div>
        </form>
    </div>
</div>
