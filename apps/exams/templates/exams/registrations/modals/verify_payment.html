{# exams/templates/exams/registrations/modals/verify_payment.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-success text-white">
            <h5 class="modal-title"><i class="fa fa-check-circle me-2"></i>Verify Payment</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4">
            <div class="mb-3"><i class="fa fa-money-bill text-success" style="font-size: 4rem;"></i></div>
            <h4 class="mb-3">Verify Payment?</h4>
            <div class="alert alert-info">
                <strong>{{ registration.student.get_full_name }}</strong><br>
                <small>{{ registration.examination.name }}</small>
            </div>
            {% if warnings %}
                <div class="alert alert-warning">
                    <ul class="text-start mb-0">{% for warning in warnings %}<li>{{ warning }}</li>{% endfor %}</ul>
                </div>
            {% endif %}
        </div>
        <form hx-post="{% url 'exams:registration_verify_payment' registration.pk %}" hx-target="#registration-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-success"><i class="fa fa-check me-1"></i>Yes, Verify Payment</button>
            </div>
        </form>
    </div>
</div>
