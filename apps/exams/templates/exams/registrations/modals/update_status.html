{# exams/templates/exams/registrations/modals/update_status.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-primary text-white">
            <h5 class="modal-title"><i class="fa fa-edit me-2"></i>Update Registration Status</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'exams:registration_update_status' registration.pk %}" hx-target="#registration-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <div class="alert alert-info">
                    <strong>{{ registration.student.get_full_name }}</strong><br>
                    <small>Current Status: <span class="badge bg-secondary">{{ registration.get_status_display }}</span></small>
                </div>
                <div class="mb-3">
                    <label class="form-label">New Status *</label>
                    <select name="status" class="form-select" required>
                        {% for value, label in status_choices %}
                        <option value="{{ value }}" {% if value == registration.status %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary"><i class="fa fa-save me-1"></i>Update</button>
            </div>
        </form>
    </div>
</div>
