<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header"
             style="background:#f5f3ff;border-bottom:1px solid #ddd6fe;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#ede9fe;border:1px solid #ddd6fe;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-layer-group" style="color:#7c3aed;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#4c1d95;">
                        Bulk Assign Grading System
                    </h5>
                    <div style="font-size:11.5px;color:#8b5cf6;margin-top:3px;">Apply one system to multiple classes at once</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'exams:bulk_class_grading_system_assign' %}" hx-target="body">
            {% csrf_token %}
            <div class="modal-body" style="padding:22px;max-height:65vh;overflow-y:auto;">
                <div style="background:#f0f9ff;border:1px solid #bae6fd;border-left:4px solid #0284c7;border-radius:0 7px 7px 0;padding:11px 14px;margin-bottom:18px;font-size:12.5px;color:#0c4a6e;">
                    <i class="fa fa-info-circle me-1"></i>
                    Existing assignments for the selected classes will be skipped (not overwritten).
                </div>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">
                            Grading System <span style="color:#ef4444;">*</span>
                        </label>
                        <select name="grading_system" class="form-select" required>
                            <option value="">— Select system —</option>
                            {% for gs in grading_systems %}
                            <option value="{{ gs.pk }}">{{ gs.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">
                            Academic Session <span style="color:#ef4444;">*</span>
                        </label>
                        <select name="academic_session" class="form-select" required>
                            <option value="">— Select session —</option>
                            {% for sess in sessions %}
                            <option value="{{ sess.pk }}">{{ sess }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">
                            Classes <span style="color:#ef4444;">*</span>
                            <span style="font-size:10px;color:#94a3b8;font-weight:400;text-transform:none;">(hold Ctrl/Cmd to select multiple)</span>
                        </label>
                        <select name="classes" class="form-select" multiple size="8" required>
                            {% for cls in classes %}
                            <option value="{{ cls.pk }}">{{ cls.academic_level.name }} — {{ cls }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-12">
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">
                            Subject
                            <span style="font-size:10px;color:#94a3b8;font-weight:400;text-transform:none;">(leave blank for class-wide)</span>
                        </label>
                        <select name="subject" class="form-select">
                            <option value="">All Subjects (class-wide)</option>
                            {% for subj in subjects %}
                            <option value="{{ subj.pk }}">{{ subj.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        <div class="modal-footer"
             style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Cancel
            </button>
            <button type="submit" class="btn-primary btn btn-sm">
                <i class="fa fa-check me-1"></i>Assign to Selected Classes
            </button>
        </div>
        </form>
    </div>
</div>
