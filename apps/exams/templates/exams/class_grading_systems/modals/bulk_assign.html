{# exams/templates/exams/class_grading_systems/modals/bulk_assign.html #}
<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header bg-primary text-white">
            <h5 class="modal-title"><i class="fa fa-users me-2"></i>Bulk Assign Grading System</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'exams:bulk_class_grading_system_assign' %}" hx-target="#assignment-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Grading System *</label>
                    <select name="grading_system" class="form-select" required>
                        <option value="">Select grading system...</option>
                        {% for system in grading_systems %}
                        <option value="{{ system.pk }}">{{ system.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Academic Session *</label>
                    <select name="academic_session" class="form-select" required>
                        <option value="">Select session...</option>
                        {% for session in sessions %}
                        <option value="{{ session.pk }}">{{ session.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Subject (Optional)</label>
                    <select name="subject" class="form-select">
                        <option value="">All Subjects</option>
                        {% for subject in subjects %}
                        <option value="{{ subject.pk }}">{{ subject.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Select Classes *</label>
                    <div class="border rounded p-2" style="max-height: 300px; overflow-y: auto;">
                        {% for class in classes %}
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="classes" value="{{ class.pk }}" id="class-{{ class.pk }}">
                            <label class="form-check-label" for="class-{{ class.pk }}">
                                {{ class }}
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary"><i class="fa fa-save me-1"></i>Assign</button>
            </div>
        </form>
    </div>
</div>
