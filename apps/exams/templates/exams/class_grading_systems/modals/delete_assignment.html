<div class="modal-dialog modal-sm">
    <div class="modal-content">
        <div class="modal-header"
             style="background:#fef2f2;border-bottom:1px solid #fecaca;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#fee2e2;border:1px solid #fecaca;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-trash" style="color:#dc2626;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#7f1d1d;">
                        Delete Assignment
                    </h5>
                    <div style="font-size:11.5px;color:#ef4444;margin-top:3px;">{{ assignment.class_instance }} → {{ assignment.grading_system.name }}</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'exams:class_grading_system_delete' assignment.pk %}" hx-target="body">
            {% csrf_token %}
            <div class="modal-body" style="padding:22px;">
                <p style="font-size:13.5px;color:#0f172a;margin:0;">
                    Remove the grading system assignment for
                    <strong>{{ assignment.class_instance }}</strong>?
                    The class will fall back to the default grading system.
                </p>
            </div>
        <div class="modal-footer"
             style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Cancel
            </button>
            <button type="submit" class="btn-danger btn btn-sm">
                <i class="fa fa-trash me-1"></i>Delete Assignment
            </button>
        </div>
        </form>
    </div>
</div>
