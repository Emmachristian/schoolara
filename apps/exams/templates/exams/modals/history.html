<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header"
             style="background:#f8fafc;border-bottom:1px solid #e2e8f0;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#f1f5f9;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-history" style="color:#475569;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#0f172a;">
                        Audit History
                    </h5>
                    <div style="font-size:11.5px;color:#64748b;margin-top:3px;">{{ content_type|title }} #{{ object_id }}</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:22px;max-height:65vh;overflow-y:auto;">
            <div style="background:#eff6ff;border:1px solid #bfdbfe;border-left:4px solid #1d4ed8;border-radius:0 7px 7px 0;padding:11px 14px;font-size:12.5px;color:#1e3a5f;">
                <i class="fa fa-info-circle me-1"></i>
                Full audit history for this record — create, update, and delete events with user and timestamp.
            </div>
            <div id="history-content" style="margin-top:16px;">
                <div style="text-align:center;padding:28px;color:#94a3b8;font-size:13px;">
                    <i class="fa fa-spinner fa-spin" style="font-size:1.5rem;display:block;margin-bottom:8px;"></i>
                    Loading history…
                </div>
            </div>
        </div>
        <div class="modal-footer"
             style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Close
            </button>
        </div>
    </div>
</div>
