{# exams/templates/exams/grading_ranges/modals/delete_range.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-danger text-white">
            <h5 class="modal-title"><i class="fa fa-trash me-2"></i>Delete Grading Range</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4">
            <div class="mb-3"><i class="fa fa-exclamation-triangle text-warning" style="font-size: 4rem;"></i></div>
            <h4 class="mb-3">Are you sure?</h4>
            <div class="alert alert-info">
                <strong>Grade: {{ range.grade }}</strong><br>
                <small>Range: {{ range.min_score }} - {{ range.max_score }}</small><br>
                <small>System: {{ range.grading_system.name }}</small>
            </div>
            <div class="alert alert-warning"><i class="fa fa-exclamation-circle me-2"></i>This action cannot be undone!</div>
        </div>
        <form hx-post="{% url 'exams:grading_range_delete' range.pk %}" hx-target="#range-list" hx-swap="outerHTML">
            {% csrf_token %}
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-danger"><i class="fa fa-trash me-1"></i>Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
