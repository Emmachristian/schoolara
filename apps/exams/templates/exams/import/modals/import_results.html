<div class="modal-dialog modal-md">
    <div class="modal-content">
        <div class="modal-header"
             style="background:#f0fdfa;border-bottom:1px solid #99f6e4;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#ccfbf1;border:1px solid #99f6e4;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-file-import" style="color:#0f766e;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#134e4a;">
                        Import Results
                    </h5>
                    <div style="font-size:11.5px;color:#14b8a6;margin-top:3px;">Upload an Excel file to bulk-import student scores</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:22px;">
            <div style="background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #b45309;border-radius:0 7px 7px 0;padding:11px 14px;margin-bottom:18px;font-size:12.5px;color:#78350f;">
                <i class="fa fa-exclamation-triangle me-1"></i>
                Imported scores will <strong>overwrite</strong> existing unlocked results for the same student and examination.
            </div>
            <div class="row g-3">
                <div class="col-12">
                    <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:6px;">
                        Examination <span style="color:#ef4444;">*</span>
                    </label>
                    <select name="examination" class="form-select">
                        <option value="">— Select examination —</option>
                        {% for exam in examinations %}
                        <option value="{{ exam.pk }}">{{ exam.name }} — {{ exam.subject.name }} ({{ exam.exam_date|date:"d M Y" }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                    <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:6px;">
                        File <span style="color:#ef4444;">*</span>
                    </label>
                    <input type="file" name="import_file" class="form-control" accept=".xlsx,.xls,.csv">
                </div>
                <div class="col-12">
                    <a href="{% url 'exams:download_results_template' %}" style="font-size:12.5px;color:#1d4ed8;">
                        <i class="fa fa-download me-1"></i>Download template
                    </a>
                </div>
            </div>
        </div>
        <div class="modal-footer"
             style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Cancel
            </button>
            <button type="submit" class="btn-success btn btn-sm">
                <i class="fa fa-file-import me-1"></i>Import Results
            </button>
        </div>
    </div>
</div>
