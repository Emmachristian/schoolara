<!-- Category Tabs -->
{% if exam_categories %}
<ul class="nav nav-tabs-custom" role="tablist">
    {% for category in exam_categories %}
    <li class="nav-item">
        <a class="nav-link {% if category.abbreviation == selected_category %}active{% endif %}"
           href="?session={{ session.pk }}&mode=dashboard&tab={{ category.abbreviation }}">
            {{ category.name }}
        </a>
    </li>
    {% endfor %}
</ul>
{% endif %}

<!-- Dashboard Results Table -->
<div id="dashboard-results">
    {% include 'exams/results/partials/_dashboard_results.html' %}
</div>
