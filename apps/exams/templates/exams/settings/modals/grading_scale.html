<div class="modal-dialog modal-md">
    <div class="modal-content">
        <div class="modal-header"
             style="background:#f8fafc;border-bottom:1px solid #e2e8f0;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#f1f5f9;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-sliders-h" style="color:#475569;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#0f172a;">
                        Grading Scale Settings
                    </h5>
                    
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:22px;max-height:65vh;overflow-y:auto;">
            {% for gs in grading_systems %}
            <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:8px;background:#f8fafc;">
                <div>
                    <div style="font-size:13px;font-weight:600;color:#0f172a;">{{ gs.name }}</div>
                    <div style="font-size:11.5px;color:#64748b;">{{ gs.get_grading_type_display }} &middot; Pass: {{ gs.pass_mark }}</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                    {% if gs.is_default %}<span style="background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe;border-radius:5px;padding:2px 8px;font-size:11px;font-weight:700;">Default</span>{% endif %}
                    <a href="{% url 'exams:grading_system_edit' gs.pk %}" class="btn btn-sm btn-outline-secondary" style="padding:2px 8px;font-size:11px;">Edit</a>
                </div>
            </div>
            {% empty %}
            <div style="text-align:center;padding:20px;color:#94a3b8;font-size:13px;">No grading systems configured.</div>
            {% endfor %}
            <div style="margin-top:14px;">
                <a href="{% url 'exams:grading_system_list' %}" class="btn btn-sm btn-outline-primary w-100">
                    <i class="fa fa-arrow-right me-1"></i>Manage All Grading Systems
                </a>
            </div>
        </div>
        <div class="modal-footer"
             style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Close
            </button>
        </div>
    </div>
</div>
