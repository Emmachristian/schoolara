<div class="modal-dialog modal-md">
    <div class="modal-content">
        <div class="modal-header"
             style="background:#f8fafc;border-bottom:1px solid #e2e8f0;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#f1f5f9;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-cog" style="color:#475569;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#0f172a;">
                        Examination Settings
                    </h5>
                    
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:22px;">
            <p style="font-size:13px;color:#475569;margin:0;">
                Examination settings are managed on the
                <a href="{% url 'exams:exam_settings' %}" style="color:#1d4ed8;font-weight:600;">Settings page</a>.
                From there you can configure default examination modes, score rounding,
                result publication rules, and more.
            </p>
        </div>
        <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Close
            </button>
            <a href="{% url 'exams:exam_settings' %}" class="btn btn-primary btn-sm">
                <i class="fa fa-cog me-1"></i>Open Settings
            </a>
        </div>
    </div>
</div>
