{# exams/templates/exams/examinations/modals/toggle_active.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header {% if action == 'reactivate' %}bg-success{% else %}bg-warning{% endif %} text-white">
            <h5 class="modal-title">
                <i class="fa {% if action == 'reactivate' %}fa-check-circle{% else %}fa-ban{% endif %} me-2"></i>
                {{ action|title }} Examination
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4">
            <div class="mb-3">
                <i class="fa {% if action == 'reactivate' %}fa-check-circle text-success{% else %}fa-ban text-warning{% endif %}" style="font-size: 4rem;"></i>
            </div>
            <h4 class="mb-3">{{ action|title }} Examination?</h4>
            <div class="alert alert-info">
                <strong>{{ examination.name }}</strong><br>
                <small>{{ examination.subject.name }}</small><br>
                <small>Current Status: {{ examination.get_status_display }}</small>
            </div>
            <div class="alert alert-{% if action == 'reactivate' %}success{% else %}warning{% endif %}">
                <i class="fa fa-info-circle me-2"></i>Status will be changed to <strong>{{ new_status }}</strong>
            </div>
        </div>
        <form hx-post="{% url 'exams:examination_toggle_active' examination.pk %}" hx-target="#examination-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn {% if action == 'reactivate' %}btn-success{% else %}btn-warning{% endif %}">
                    <i class="fa {% if action == 'reactivate' %}fa-check{% else %}fa-ban{% endif %} me-1"></i>Yes, {{ action|title }}
                </button>
            </div>
        </form>
    </div>
</div>
