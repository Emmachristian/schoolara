<div class="modal-dialog modal-sm">
    <div class="modal-content">
        <div class="modal-header"
             style="background:#fffbeb;border-bottom:1px solid #fde68a;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#fef3c7;border:1px solid #fde68a;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-sync" style="color:#b45309;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#78350f;">
                        Update Status
                    </h5>
                    <div style="font-size:11.5px;color:#d97706;margin-top:3px;">{{ examination.name }}</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'exams:examination_update_status' examination.pk %}" hx-target="body">
            {% csrf_token %}
            <div class="modal-body" style="padding:22px;">
                <div style="margin-bottom:16px;font-size:12.5px;">
                    <span style="color:#64748b;">Current status:</span>
                    <strong style="margin-left:6px;">{{ examination.get_status_display }}</strong>
                </div>
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:6px;">
                    New Status <span style="color:#ef4444;">*</span>
                </label>
                <select name="status" class="form-select" required>
                    {% for code, label in status_choices %}
                        {% if code in available_statuses %}
                        <option value="{{ code }}">{{ label }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
        <div class="modal-footer"
             style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Cancel
            </button>
            <button type="submit" class="btn-warning btn btn-sm">
                <i class="fa fa-sync me-1"></i>Update Status
            </button>
        </div>
        </form>
    </div>
</div>
