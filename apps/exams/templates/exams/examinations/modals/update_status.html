{# exams/templates/exams/examinations/modals/update_status.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-primary text-white">
            <h5 class="modal-title"><i class="fa fa-edit me-2"></i>Update Examination Status</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'exams:examination_update_status' examination.pk %}" hx-target="#examination-results" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body">
                <div class="alert alert-info">
                    <strong>{{ examination.name }}</strong><br>
                    <small>Current Status: <span class="badge bg-secondary">{{ examination.get_status_display }}</span></small>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">New Status *</label>
                    <select name="status" class="form-select" required>
                        <option value="">Select new status...</option>
                        {% for status_value, status_label in status_choices %}
                            {% if status_value in available_statuses %}
                            <option value="{{ status_value }}">{{ status_label }}</option>
                            {% endif %}
                        {% endfor %}
                    </select>
                    <small class="text-muted">Only valid status transitions are shown</small>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary"><i class="fa fa-save me-1"></i>Update Status</button>
            </div>
        </form>
    </div>
</div>
