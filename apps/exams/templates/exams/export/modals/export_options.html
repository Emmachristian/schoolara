<div class="modal-dialog modal-md">
    <div class="modal-content">
        <div class="modal-header"
             style="background:#f0fdfa;border-bottom:1px solid #99f6e4;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#ccfbf1;border:1px solid #99f6e4;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-file-export" style="color:#0f766e;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#134e4a;">
                        Export Options
                    </h5>
                    <div style="font-size:11.5px;color:#14b8a6;margin-top:3px;">{{ resource_type|title }}</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:22px;">
            <p style="font-size:13px;color:#475569;margin-bottom:18px;">
                Choose an export format. All active filters from the list view are applied.
            </p>
            <a href="{% url 'exams:export_results_excel' %}?{{ request.GET.urlencode }}"
               class="d-flex align-items-center gap-3 p-3 text-decoration-none"
               style="border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;margin-bottom:10px;">
                <div style="width:36px;height:36px;background:#f0fdf4;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px solid #bbf7d0;flex-shrink:0;">
                    <i class="fa fa-file-excel" style="color:#15803d;font-size:16px;"></i>
                </div>
                <div>
                    <div style="font-size:13px;font-weight:700;color:#0f172a;">Excel (.xlsx)</div>
                    <div style="font-size:11.5px;color:#64748b;">Download as a spreadsheet. Best for analysis and editing.</div>
                </div>
            </a>
        </div>
        <div class="modal-footer"
             style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Close
            </button>
        </div>
    </div>
</div>
