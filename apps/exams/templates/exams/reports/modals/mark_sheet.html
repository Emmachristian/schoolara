<div class="modal-dialog modal-md">
    <div class="modal-content">
        <div class="modal-header"
             style="background:#f0fdfa;border-bottom:1px solid #99f6e4;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#ccfbf1;border:1px solid #99f6e4;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-file-alt" style="color:#0f766e;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#134e4a;">
                        Mark Sheet
                    </h5>
                    <div style="font-size:11.5px;color:#14b8a6;margin-top:3px;">Select an examination to generate the report</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:22px;">
            <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:6px;">
                Examination <span style="color:#ef4444;">*</span>
            </label>
            <select id="report-exam-select" class="form-select mb-3">
                <option value="">— Select examination —</option>
                {% for exam in examinations %}
                <option value="{% url 'exams:mark_sheet_report' exam.pk %}">
                    {{ exam.name }} — {{ exam.subject.name }} ({{ exam.exam_date|date:"d M Y" }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Cancel
            </button>
            <a href="#" class="btn btn-sm" style="background:#0f766e;color:#fff;border:none;"
               onclick="var v=document.getElementById('report-exam-select').value;if(v)window.open(v,'_blank');return false;">
                <i class="fa fa-external-link-alt me-1"></i>Open Report
            </a>
        </div>
    </div>
</div>
