<div class="modal-dialog modal-md">
    <div class="modal-content">
        <div class="modal-header"
             style="background:#f5f3ff;border-bottom:1px solid #ddd6fe;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#ede9fe;border:1px solid #ddd6fe;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-calendar-plus" style="color:#7c3aed;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#4c1d95;">
                        Generate Timetable
                    </h5>
                    <div style="font-size:11.5px;color:#8b5cf6;margin-top:3px;">Configure session and categories for the timetable</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:22px;">
            <div style="background:#f0f9ff;border:1px solid #bae6fd;border-left:4px solid #0284c7;border-radius:0 7px 7px 0;padding:11px 14px;margin-bottom:18px;font-size:12.5px;color:#0c4a6e;">
                <i class="fa fa-info-circle me-1"></i>
                This will prepare the timetable view for the selected session.
                Examinations must already be created.
            </div>
            <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:6px;">
                Academic Session <span style="color:#ef4444;">*</span>
            </label>
            <select id="tt-session-select" class="form-select">
                <option value="">— Select session —</option>
                {% for sess in sessions %}
                <option value="{% url 'exams:exam_timetable_session' sess.pk %}">{{ sess }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Cancel
            </button>
            <a href="#" class="btn btn-primary btn-sm"
               onclick="var v=document.getElementById('tt-session-select').value;if(v){window.location.href=v;}return false;">
                <i class="fa fa-calendar-alt me-1"></i>View Timetable
            </a>
        </div>
    </div>
</div>
