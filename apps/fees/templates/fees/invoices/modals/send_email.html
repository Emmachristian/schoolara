{% load currency_filters %}
<div class="modal-dialog modal-md">
    <div class="modal-content">

        <div class="modal-header" style="background:#eff6ff;border-bottom:1px solid #bfdbfe;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;border:1px solid #bfdbfe;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-envelope" style="color:#3b82f6;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#1e3a8a;">Send Invoice by Email</h5>
                    <div style="font-size:11.5px;color:#3b82f6;margin-top:3px;">{{ invoice.invoice_number }} &middot; {{ invoice.student.get_full_name }}</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <form method="POST" hx-post="{% url 'fees:invoice_send_email' invoice.pk %}" hx-target="body" hx-swap="none">
            {% csrf_token %}

            <div class="modal-body" style="padding:22px;">

                <div class="mb-3">
                    <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:6px;">
                        Recipients <span style="color:#ef4444;">*</span>
                    </label>
                    {% if student_email %}
                    <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:13px;">
                        <input type="checkbox" name="recipients" value="{{ student_email }}" checked>
                        <span>{{ invoice.student.get_full_name }} &mdash; {{ student_email }}</span>
                    </label>
                    {% endif %}
                    {% for email in parent_emails %}
                    <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:13px;">
                        <input type="checkbox" name="recipients" value="{{ email }}" checked>
                        <span>Parent/Guardian &mdash; {{ email }}</span>
                    </label>
                    {% endfor %}
                    <input type="text" name="recipients" class="form-control form-control-sm mt-2"
                           placeholder="Add additional email address...">
                </div>

                <div class="mb-0">
                    <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">
                        Custom Message <span style="font-size:10px;color:#94a3b8;font-weight:400;text-transform:none;">(optional)</span>
                    </label>
                    <textarea name="custom_message" rows="3" class="form-control form-control-sm"
                              placeholder="Add a personal note to the email..."></textarea>
                </div>

            </div>

            <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                    <i class="fa fa-times me-1"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="fa fa-envelope me-1"></i> Send Invoice
                </button>
            </div>

        </form>

    </div>
</div>
