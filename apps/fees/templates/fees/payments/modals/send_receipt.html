{% load currency_filters %}
<div class="modal-dialog modal-sm">
    <div class="modal-content">

        <div class="modal-header" style="background:#eff6ff;border-bottom:1px solid #bfdbfe;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;border:1px solid #bfdbfe;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-envelope" style="color:#3b82f6;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#1e3a8a;">Send Receipt</h5>
                    <div style="font-size:11.5px;color:#3b82f6;margin-top:3px;">{{ payment.payment_number }} &middot; {{ payment.amount|money }}</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <form method="POST" hx-post="{% url 'fees:payment_send_receipt' payment.pk %}" hx-target="body" hx-swap="none">
            {% csrf_token %}

            <div class="modal-body" style="padding:22px;">

                <div class="mb-0">
                    <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:6px;">
                        Recipients <span style="color:#ef4444;">*</span>
                    </label>

                    {% if student_email %}
                    <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:13px;color:#0f172a;">
                        <input type="checkbox" name="recipients" value="{{ student_email }}" checked class="form-check-input" style="margin:0;">
                        <div>
                            <div style="font-weight:600;">{{ payment.student.get_full_name }}</div>
                            <div style="font-size:11px;color:#64748b;">{{ student_email }}</div>
                        </div>
                    </label>
                    {% endif %}

                    {% if paid_by_email and paid_by_email != student_email %}
                    <label style="display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:4px;cursor:pointer;font-size:13px;color:#0f172a;">
                        <input type="checkbox" name="recipients" value="{{ paid_by_email }}" checked class="form-check-input" style="margin:0;">
                        <div>
                            <div style="font-weight:600;">{{ payment.paid_by_name|default:"Payer" }}</div>
                            <div style="font-size:11px;color:#64748b;">{{ paid_by_email }}</div>
                        </div>
                    </label>
                    {% endif %}

                    <input type="text" name="recipients"
                           class="form-control form-control-sm mt-2"
                           placeholder="Add another email address...">
                    <div style="font-size:11px;color:#94a3b8;margin-top:3px;">Separate multiple addresses with commas</div>
                </div>

            </div>

            <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                    <i class="fa fa-times me-1"></i> Cancel
                </button>
                <button type="submit" class="btn btn-primary btn-sm">
                    <i class="fa fa-envelope me-1"></i> Send Receipt
                </button>
            </div>

        </form>

    </div>
</div>
