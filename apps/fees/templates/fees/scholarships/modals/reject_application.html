{% load currency_filters %}
<div class="modal-dialog modal-sm">
    <div class="modal-content">

        <div class="modal-header" style="background:#fef2f2;border-bottom:1px solid #fecaca;padding:16px 22px;">
            <div>
                <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#7f1d1d;">
                    <i class="fa fa-times-circle me-2" style="color:#dc2626;"></i>Reject Application
                </h5>
                <div style="font-size:11.5px;color:#991b1b;margin-top:3px;">
                    {{ application.application_number }} &middot; {{ application.student.get_full_name }}
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <form method="POST" hx-post="{% url 'fees:scholarship_application_review' application.pk %}" hx-target="body" hx-swap="none">
            {% csrf_token %}
            <input type="hidden" name="decision" value="REJECT">

            <div class="modal-body" style="padding:22px;">

                <div style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:#fff7ed;border:1px solid #fed7aa;border-left:4px solid #f97316;border-radius:0 7px 7px 0;margin-bottom:18px;">
                    <i class="fa fa-exclamation-triangle" style="color:#f97316;margin-top:2px;flex-shrink:0;"></i>
                    <div style="font-size:13px;color:#9a3412;line-height:1.6;">
                        The applicant will be notified of the rejection. This decision can be updated later if required.
                    </div>
                </div>

                <div class="mb-0">
                    <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">
                        Rejection Reason <span style="color:#ef4444;">*</span>
                    </label>
                    <textarea name="reviewer_notes" rows="4" class="form-control form-control-sm"
                              placeholder="Reason for rejecting this application..." required></textarea>
                </div>

            </div>

            <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                    <i class="fa fa-times me-1"></i> Cancel
                </button>
                <button type="submit" class="btn btn-danger btn-sm">
                    <i class="fa fa-times-circle me-1"></i> Reject Application
                </button>
            </div>

        </form>

    </div>
</div>
