{% load currency_filters %}
<div class="modal-dialog modal-sm">
    <div class="modal-content">

        <div class="modal-header" style="background:#f0fdf4;border-bottom:1px solid #bbf7d0;padding:16px 22px;">
            <div>
                <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#14532d;">
                    <i class="fa fa-check-circle me-2" style="color:#16a34a;"></i>Activate Program
                </h5>
                <div style="font-size:11.5px;color:#16a34a;margin-top:3px;">{{ program.name }}</div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body" style="padding:22px;">

            <div style="display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-left:4px solid #22c55e;border-radius:0 7px 7px 0;margin-bottom:14px;">
                <i class="fa fa-check-circle" style="color:#16a34a;margin-top:2px;flex-shrink:0;"></i>
                <div style="font-size:13px;color:#14532d;line-height:1.6;">
                    Activating will make this program visible and allow scholarships to be awarded from it.
                </div>
            </div>

            <p style="font-size:13.5px;color:#0f172a;line-height:1.7;margin-bottom:0;">
                Activate <strong>{{ program.name }}</strong>?
            </p>

        </div>

        <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i> Cancel
            </button>
            <form method="POST" hx-post="{% url 'fees:scholarship_program_activate' program.pk %}" hx-target="body" hx-swap="none" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-success btn-sm">
                    <i class="fa fa-check-circle me-1"></i> Activate
                </button>
            </form>
        </div>

    </div>
</div>
