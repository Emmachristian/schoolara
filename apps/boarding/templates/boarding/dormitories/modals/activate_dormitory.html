{# ── activate_dormitory.html ── #}
<div class="modal-dialog modal-sm">
<div class="modal-content">

    <div class="modal-header"
         style="background:#f0fdf4; border-bottom:1px solid #bbf7d0; padding:16px 22px;">
        <div class="d-flex align-items-center gap-3">
            <div style="width:40px; height:40px; border-radius:10px; background:#dcfce7; border:1px solid #bbf7d0; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                <i class="fa fa-toggle-on" style="color:#15803d; font-size:1rem;"></i>
            </div>
            <div>
                <h5 class="modal-title mb-0" style="font-weight:700; font-size:16px; color:#14532d;">
                    Activate Dormitory
                </h5>
                <div style="font-size:11.5px; color:#16a34a; margin-top:3px;">
                    {{ dormitory.name }} &middot; {{ dormitory.code }}
                </div>
            </div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <form method="POST"
          hx-post="{% url 'boarding:dormitory_activate' dormitory.pk %}"
          hx-target="#modal-container"
          hx-swap="innerHTML">
        {% csrf_token %}

        <div class="modal-body" style="padding:22px;">
            <p style="font-size:13px; color:#475569; margin:0;">
                Activating <strong>{{ dormitory.name }}</strong> will make it available for
                new boarding enrollments. Continue?
            </p>
        </div>

        <div class="modal-footer" style="background:#f8fafc; border-top:1px solid #e2e8f0; padding:12px 22px; justify-content:space-between;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Cancel
            </button>
            <button type="submit" class="btn btn-success btn-sm">
                <i class="fa fa-toggle-on me-1"></i>Activate
            </button>
        </div>

    </form>
</div>
</div>
