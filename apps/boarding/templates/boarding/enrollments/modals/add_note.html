<div class="modal-dialog modal-sm">
<div class="modal-content">

    <div class="modal-header"
         style="background:#eff6ff; border-bottom:1px solid #bfdbfe; padding:16px 22px;">
        <div class="d-flex align-items-center gap-3">
            <div style="width:40px; height:40px; border-radius:10px; background:#dbeafe; border:1px solid #bfdbfe; display:flex; align-items:center; justify-content:center; flex-shrink:0;">
                <i class="fa fa-sticky-note" style="color:#1d4ed8; font-size:1rem;"></i>
            </div>
            <div>
                <h5 class="modal-title mb-0" style="font-weight:700; font-size:16px; color:#1e3a5f;">
                    Add Note
                </h5>
                <div style="font-size:11.5px; color:#3b82f6; margin-top:3px;">
                    {{ enrollment.student.get_full_name }} &middot; {{ enrollment.dormitory.name }}
                </div>
            </div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <form method="POST"
          hx-post="{% url 'boarding:enrollment_add_note' enrollment.pk %}"
          hx-target="#modal-container"
          hx-swap="innerHTML">
        {% csrf_token %}

        <div class="modal-body" style="padding:22px;">

            {% if enrollment.notes %}
            <div style="font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:#94a3b8; margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid #f1f5f9;">
                Existing Notes
            </div>
            <div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; padding:10px 12px; font-size:12.5px; color:#475569; margin-bottom:16px; white-space:pre-wrap;">{{ enrollment.notes }}</div>
            {% endif %}

            <label style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:#64748b; display:block; margin-bottom:4px;">
                {% if enrollment.notes %}Append Note{% else %}Note{% endif %}
                <span style="color:#ef4444;">*</span>
            </label>
            {{ form.note }}
            {% if form.note.errors %}
                {% for e in form.note.errors %}
                <div style="font-size:11.5px; color:#dc2626; margin-top:3px;">
                    <i class="fa fa-exclamation-circle me-1"></i>{{ e }}
                </div>
                {% endfor %}
            {% endif %}

        </div>

        <div class="modal-footer" style="background:#f8fafc; border-top:1px solid #e2e8f0; padding:12px 22px; justify-content:space-between;">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">
                <i class="fa fa-times me-1"></i>Cancel
            </button>
            <button type="submit" class="btn btn-primary btn-sm">
                <i class="fa fa-save me-1"></i>Save Note
            </button>
        </div>

    </form>
</div>
</div>
