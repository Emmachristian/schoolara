<div class="modal-dialog modal-lg">
    <div class="modal-content">
        <div class="modal-header" style="background:#eff6ff;border-bottom:1px solid #bfdbfe;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <i class="fa fa-users" style="color:#1d4ed8;font-size:1rem;"></i>
                </div>
                <div>
                    <h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#1e3a5f;">Bulk Measurement Entry</h5>
                    <div style="font-size:11.5px;color:#1d4ed8;margin-top:3px;">Record measurements for an entire class</div>
                </div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" style="padding:22px;">
            <div style="background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #f59e0b;border-radius:0 7px 7px 0;padding:10px 14px;margin-bottom:18px;display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#92400e;">
                <i class="fa fa-info-circle" style="color:#b45309;flex-shrink:0;margin-top:1px;"></i>
                <span>Select a class and session below, then you will be taken to the bulk entry page to record measurements for all students in that class.</span>
            </div>
            <form method="get" action="{% url 'uniforms:student_measurement_bulk_create' %}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Class <span style="color:#ef4444;">*</span></label>
                        <select name="class" class="form-select form-select-sm" required>
                            <option value="">Select class…</option>
                            {% for cls in classes %}
                            <option value="{{ cls.pk }}">{{ cls.get_display_name }} — {{ cls.academic_level.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Academic Session</label>
                        <select name="session" class="form-select form-select-sm">
                            <option value="">Current session</option>
                            {% for s in sessions %}
                            <option value="{{ s.pk }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="mt-4" style="text-align:right;">
                    <button type="button" class="btn btn-outline-secondary btn-sm me-2" data-bs-dismiss="modal"><i class="fa fa-times me-1"></i> Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm"><i class="fa fa-arrow-right me-1"></i> Start Bulk Entry</button>
                </div>
            </form>
        </div>
    </div>
</div>
