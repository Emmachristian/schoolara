<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header" style="background:#eff6ff;border-bottom:1px solid #bfdbfe;padding:16px 22px;">
            <div class="d-flex align-items-center gap-3">
                <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa fa-exchange-alt" style="color:#1d4ed8;font-size:1rem;"></i></div>
                <div><h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#1e3a5f;">Transfer Stock Between Sizes</h5><div style="font-size:11.5px;color:#1d4ed8;margin-top:3px;">{{ item.name }}</div></div>
            </div>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form hx-post="{% url 'uniforms:uniform_item_transfer_stock' item.pk %}" hx-target="#modal-container" hx-swap="innerHTML">
            {% csrf_token %}
            <div class="modal-body" style="padding:22px;">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">From Size <span style="color:#ef4444;">*</span></label>
                        <select name="from_stock" class="form-select form-select-sm" required>
                            <option value="">Select source…</option>
                            {% for stock in stock_records %}
                            <option value="{{ stock.pk }}">{% if stock.size %}{{ stock.size.name }}{% else %}Unsized{% endif %} ({{ stock.quantity }} available)</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">To Size <span style="color:#ef4444;">*</span></label>
                        <select name="to_stock" class="form-select form-select-sm" required>
                            <option value="">Select destination…</option>
                            {% for stock in stock_records %}
                            <option value="{{ stock.pk }}">{% if stock.size %}{{ stock.size.name }}{% else %}Unsized{% endif %} ({{ stock.quantity }} current)</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div>
                    <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Quantity to Transfer <span style="color:#ef4444;">*</span></label>
                    <input type="number" name="quantity" class="form-control form-control-sm" min="1" step="1" required placeholder="0">
                </div>
            </div>
            <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal"><i class="fa fa-times me-1"></i> Cancel</button>
                <button type="submit" class="btn btn-primary btn-sm"><i class="fa fa-exchange-alt me-1"></i> Transfer</button>
            </div>
        </form>
    </div>
</div>
