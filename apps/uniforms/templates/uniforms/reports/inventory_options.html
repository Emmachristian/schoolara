<div class="modal-dialog modal-lg"><div class="modal-content">
    <div class="modal-header" style="background:#eff6ff;border-bottom:1px solid #bfdbfe;padding:16px 22px;">
        <div class="d-flex align-items-center gap-3">
            <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa fa-chart-bar" style="color:#1d4ed8;"></i></div>
            <div><h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#1e3a5f;">Inventory Report</h5><div style="font-size:11.5px;color:#1d4ed8;margin-top:3px;">Configure report options</div></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <form method="get" action="{% url 'uniforms:inventory_report' %}">
    <div class="modal-body" style="padding:22px;">
        <div class="row g-3">
            <div class="col-md-6">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Stock Status</label>
                <select name="stock_status" class="form-select form-select-sm">
                    <option value="">All</option>
                    <option value="LOW">Low Stock Only</option>
                    <option value="OUT">Out of Stock Only</option>
                    <option value="OK">Adequately Stocked</option>
                </select>
            </div>
            <div class="col-md-6">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Item Type</label>
                <select name="item_type" class="form-select form-select-sm">
                    <option value="">All Types</option>
                    <option value="SHIRT">Shirts</option>
                    <option value="TROUSER">Trousers</option>
                    <option value="DRESS">Dresses</option>
                    <option value="SKIRT">Skirts</option>
                    <option value="SHOE">Shoes</option>
                    <option value="SWEATER">Sweaters</option>
                    <option value="OTHER">Other</option>
                </select>
            </div>
            <div class="col-md-6">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Gender</label>
                <select name="gender" class="form-select form-select-sm">
                    <option value="">All</option>
                    <option value="M">Boys</option>
                    <option value="F">Girls</option>
                    <option value="U">Unisex</option>
                </select>
            </div>
            <div class="col-md-6">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Active Items Only</label>
                <select name="is_active" class="form-select form-select-sm">
                    <option value="true" selected>Yes</option>
                    <option value="">All</option>
                    <option value="false">Inactive Only</option>
                </select>
            </div>
        </div>
    </div>
    <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal"><i class="fa fa-times me-1"></i> Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm"><i class="fa fa-file-alt me-1"></i> Generate Report</button>
    </div>
    </form>
</div></div>
