<div class="modal-dialog"><div class="modal-content">
    <div class="modal-header" style="background:#eff6ff;border-bottom:1px solid #bfdbfe;padding:16px 22px;">
        <div class="d-flex align-items-center gap-3">
            <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa fa-ruler" style="color:#1d4ed8;"></i></div>
            <div><h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#1e3a5f;">Measurement Summary Report</h5><div style="font-size:11.5px;color:#1d4ed8;margin-top:3px;">Configure filters</div></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <form method="get" action="{% url 'uniforms:measurement_summary_report' %}">
    <div class="modal-body" style="padding:22px;">
        <div class="row g-3">
            <div class="col-12">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Class</label>
                <select name="class" class="form-select form-select-sm">
                    <option value="">All Classes</option>
                    {% for cls in classes %}<option value="{{ cls.pk }}">{{ cls.get_display_name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Academic Session</label>
                <select name="session" class="form-select form-select-sm">
                    <option value="">All Sessions</option>
                    {% for s in sessions %}<option value="{{ s.pk }}">{{ s.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Show Only</label>
                <select name="filter" class="form-select form-select-sm">
                    <option value="">All Students</option>
                    <option value="missing">Students With Missing Measurements</option>
                    <option value="unverified">Students With Unverified Measurements</option>
                    <option value="complete">Students With Complete Measurements</option>
                </select>
            </div>
        </div>
    </div>
    <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal"><i class="fa fa-times me-1"></i> Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm"><i class="fa fa-file-alt me-1"></i> Generate Report</button>
    </div>
    </form>
</div></div>
