<div class="modal-dialog"><div class="modal-content">
    <div class="modal-header" style="background:#eff6ff;border-bottom:1px solid #bfdbfe;padding:16px 22px;">
        <div class="d-flex align-items-center gap-3">
            <div style="width:40px;height:40px;border-radius:10px;background:#dbeafe;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa fa-chart-line" style="color:#1d4ed8;"></i></div>
            <div><h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#1e3a5f;">Sales Report</h5><div style="font-size:11.5px;color:#1d4ed8;margin-top:3px;">Configure report filters</div></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <form method="get" action="{% url 'uniforms:sales_report' %}">
    <div class="modal-body" style="padding:22px;">
        <div class="row g-3">
            <div class="col-12">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Academic Session</label>
                <select name="session" class="form-select form-select-sm">
                    <option value="">All Sessions</option>
                    {% for s in sessions %}<option value="{{ s.pk }}">{{ s.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Date From</label>
                <input type="date" name="date_from" class="form-control form-control-sm">
            </div>
            <div class="col-md-6">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Date To</label>
                <input type="date" name="date_to" class="form-control form-control-sm">
            </div>
            <div class="col-12">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Status</label>
                <select name="status" class="form-select form-select-sm">
                    <option value="">All Statuses</option>
                    <option value="ISSUED">Issued</option>
                    <option value="PAID">Paid (not yet issued)</option>
                    <option value="PENDING">Pending</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>
        </div>
    </div>
    <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal"><i class="fa fa-times me-1"></i> Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm"><i class="fa fa-file-alt me-1"></i> Generate Report</button>
    </div>
    </form>
</div></div>
