{% load currency_filters %}
<div class="modal-dialog"><div class="modal-content">
    <div class="modal-header" style="background:#fef2f2;border-bottom:1px solid #fecaca;padding:16px 22px;">
        <div class="d-flex align-items-center gap-3">
            <div style="width:40px;height:40px;border-radius:10px;background:#fee2e2;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa fa-times-circle" style="color:#dc2626;"></i></div>
            <div><h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#991b1b;">Cancel Sale</h5><div style="font-size:11.5px;color:#dc2626;margin-top:3px;">{{ sale.sale_number }} &middot; {{ sale.total_amount|money }}</div></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <form hx-post="{% url 'uniforms:uniform_sale_cancel' sale.pk %}" hx-target="#modal-container" hx-swap="innerHTML">{% csrf_token %}
    <div class="modal-body" style="padding:22px;">
        {% for warning in warnings %}<div style="background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #f59e0b;color:#92400e;border-radius:0 7px 7px 0;padding:10px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;font-size:13px;"><i class="fa fa-exclamation-triangle" style="flex-shrink:0;margin-top:1px;color:#b45309;"></i><span>{{ warning }}</span></div>{% endfor %}
        <div style="margin-top:8px;">
            <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Cancellation Reason <span style="color:#ef4444;">*</span></label>
            <textarea name="cancellation_reason" class="form-control form-control-sm" rows="3" required placeholder="Reason for cancelling this sale…"></textarea>
        </div>
    </div>
    <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal"><i class="fa fa-times me-1"></i> Keep Sale</button>
        {% if can_cancel %}<button type="submit" class="btn btn-danger btn-sm"><i class="fa fa-ban me-1"></i> Cancel Sale</button>{% else %}<button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>{% endif %}
    </div>
    </form>
</div></div>
