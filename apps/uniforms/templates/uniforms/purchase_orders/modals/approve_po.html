{% load currency_filters %}
<div class="modal-dialog"><div class="modal-content">
    <div class="modal-header" style="background:#f0fdf4;border-bottom:1px solid #bbf7d0;padding:16px 22px;">
        <div class="d-flex align-items-center gap-3">
            <div style="width:40px;height:40px;border-radius:10px;background:#dcfce7;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa fa-check-circle" style="color:#15803d;"></i></div>
            <div><h5 class="modal-title mb-0" style="font-weight:700;font-size:16px;color:#14532d;">Approve Purchase Order</h5><div style="font-size:11.5px;color:#15803d;margin-top:3px;">{{ po.po_number }} &middot; {{ po.total_amount|money }}</div></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <form hx-post="{% url 'uniforms:purchase_order_approve' po.pk %}" hx-target="#modal-container" hx-swap="innerHTML">{% csrf_token %}
    <div class="modal-body" style="padding:22px;">
        {% for warning in warnings %}<div style="background:#fffbeb;border:1px solid #fde68a;border-left:4px solid #f59e0b;color:#92400e;border-radius:0 7px 7px 0;padding:10px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;font-size:13px;"><i class="fa fa-exclamation-triangle" style="flex-shrink:0;margin-top:1px;color:#b45309;"></i><span>{{ warning }}</span></div>{% endfor %}
        <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px 16px;margin-bottom:14px;">
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px;"><span style="color:#64748b;">PO Number</span><span style="font-weight:700;font-family:monospace;">{{ po.po_number }}</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:13px;"><span style="color:#64748b;">Supplier</span><span style="font-weight:600;">{{ po.supplier_name|default:"—" }}</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;font-size:13px;"><span style="color:#64748b;">Total</span><span style="font-weight:700;color:#1d4ed8;font-size:15px;">{{ po.total_amount|money }}</span></div>
        </div>
        <div style="margin-bottom:14px;">
            <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#64748b;display:block;margin-bottom:4px;">Approval Notes (optional)</label>
            <textarea name="approval_notes" class="form-control form-control-sm" rows="2" placeholder="Any notes for the approval…"></textarea>
        </div>
    </div>
    <div class="modal-footer" style="background:#f8fafc;border-top:1px solid #e2e8f0;padding:12px 22px;justify-content:space-between;">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal"><i class="fa fa-times me-1"></i> Cancel</button>
        <button type="submit" class="btn btn-success btn-sm"><i class="fa fa-check me-1"></i> Approve Order</button>
    </div>
    </form>
</div></div>
