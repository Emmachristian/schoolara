{# hr/templates/hr/staff/modals/bulk_action.html #}
<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header bg-primary text-white">
            <h5 class="modal-title"><i class="fa fa-tasks me-2"></i>Bulk Action</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="bulkActionForm" hx-post="{% url 'hr:bulk_staff_action' %}" hx-target="#staff-results" hx-swap="innerHTML">
            {% csrf_token %}
            <input type="hidden" name="selected_ids" value="{{ selected_ids }}">
            
            <div class="modal-body py-4">
                <div class="text-center mb-4">
                    <i class="fa fa-users text-primary" style="font-size: 4rem;"></i>
                    <h4 class="mt-3">Perform Action on {{ selected_count }} Staff Member(s)</h4>
                </div>
                
                <div class="mb-3">
                    <label for="action" class="form-label">Select Action <span class="text-danger">*</span></label>
                    <select class="form-select" id="action" name="action" required>
                        <option value="">-- Choose Action --</option>
                        <option value="activate">Activate Selected</option>
                        <option value="deactivate">Deactivate Selected</option>
                        <option value="export">Export to Excel</option>
                    </select>
                </div>
                
                <div class="alert alert-info">
                    <i class="fa fa-info-circle me-2"></i><strong>Note:</strong>
                    <ul class="mb-0 mt-2 small">
                        <li><strong>Activate:</strong> Mark staff as active</li>
                        <li><strong>Deactivate:</strong> Mark staff as inactive (requires no active contracts)</li>
                        <li><strong>Export:</strong> Download selected staff data as Excel</li>
                    </ul>
                </div>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">
                    <i class="fa fa-bolt me-1"></i>Execute Action
                </button>
            </div>
        </form>
    </div>
</div>
